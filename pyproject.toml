[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opie-engine"
version = "0.2.0"
description = "Open Policy Illustration Engine (OPIE) — deterministic life insurance illustration engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "typer>=0.12",
]

[project.scripts]
opie = "opie.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["opie", "opie_ui", "opie_pdf"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

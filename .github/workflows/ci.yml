name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps
        run: uv sync

      - name: CLI smoke
        run: uv run opie --help

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
